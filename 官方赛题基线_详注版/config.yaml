# =============================================================================
# 文件: config.yaml
# 作用: 赛题官方基线的"总配置"——模型超参 + 数据管线 + 归一化 + DataLoader 全在这里
# 谁读它: train.py / inference.py / result.py 都用 onescience 的 YParams(此文件, "段名") 读取
# 关键点:
#   1) 标了 "AI4S ... 不可更改" 的行是赛题硬约束,改了会判错或报错(尤其 batch_size/分辨率/世界大小)
#   2) test_ratio 提交时必须改成 [2050,2052,2054,2056,2058](后台真实测试年份的"标识")
#   3) channels 的顺序 = 数据通道顺序 = 评分通道顺序,三者必须一致(共 69 个变量)
# (本文件为官方原始配置逐行加注释版,配置项与取值零改动,仅新增中文注释)
# =============================================================================

model:
    start_epoch: 0            # 起始 epoch(断点续训时可 >0)
    max_epoch: 2             # 训练总轮数;仅想快速验证代码跑通时可设为 1
    patch_size: [2, 4, 4]    # Patch 大小 (气压层, 纬, 经):13层→⌈13/2⌉=7,721→181,1440→360
    embed_dim: 192           # Patch 嵌入维度(每个 patch 投影成 192 维向量)
    num_heads: [6, 12, 12, 6]# 四个阶段(layer1/2/3/4)各自的多头注意力头数
    window_size: [2, 6, 12]  # 三维窗口大小 (气压, 纬, 经):窗口注意力只在窗口内算,省显存
    patience: 50             # 早停耐心值:验证 loss 连续 50 轮不降则停
    checkpoint_dir: "./data/checkpoints"         # AI4S，路径不可更改  # 权重/loss 曲线存这里,inference 从此读 model_bak.pth

datapipe:
  name: "ERA5"                       # 数据集名称(ERA5 是欧洲中心再分析数据,气象界标准数据)
  task: "weather_forecasting"        # 任务类型:天气预报(给 t 时刻,预测 t+6h)

  # dataset设定
  dataset:
    type: "hdf5"                     # 数据以 HDF5(.h5) 格式存储

    # 下面三行是"远程/集群共享盘"的路径(被注释掉了),赛题环境用的是本地拉取路径(见下方启用的三行)
    # stats_dir: "/work2/share/sugonhpcapp01/ERA5/old-data/stats"     # AI4S，拉取远程ERA5数据
    # static_dir: "/work2/share/sugonhpcapp01/ERA5/old-data/static"   # AI4S，拉取远程ERA5数据
    # data_dir: "/work2/share/sugonhpcapp01/ERA5/old-data"            # AI4S，拉取远程ERA5数据

    # train_ratio: [1980, 1981, 1982, 1983, 1984, 1985]
    # val_ratio: [1986]
    # test_ratio: [2000]                                # AI4S，后台测试中，该年份只是标识，并非真实年份, 提交代码时需修改为[2050, 2052, 2054, 2056, 2058] ！！！！

    # ↓↓↓ 实际启用的本地路径(赛题把数据拉到 ../onedatasets/ERA5_test/ 下)
    stats_dir: "../onedatasets/ERA5_test/stats/"     # AI4S，路径不可更改, 拉取本地ERA5数据  # 归一化用的 global_means.npy / global_stds.npy
    static_dir: "../onedatasets/ERA5_test/static/"   # AI4S，路径不可更改, 拉取本地本地ERA5数据 # 静态场 land_mask/soil_type/topography.npy
    data_dir: "../onedatasets/ERA5_test/"            # AI4S，路径不可更改 , 拉取本地本地ERA5数据 # ERA5 主数据根目录(下有 data/{年}/*.h5)

    train_ratio: [1977]              # 训练用哪些"年份"的数据(这里只用 1977 一年做示例)
    val_ratio: [2005]                # 验证年份
    test_ratio: [2012] # [2050, 2052, 2054, 2056, 2058]       # AI4S，后台测试中，该年份只是标识，并非真实年份, 提交代码时需修改为[2050, 2052, 2054, 2056, 2058] ！！！！
                                     # ↑ 本地调试用 2012;正式提交必须换成那 5 个"标识年",后台会替换成真实测试数据

    img_size: [721, 1440]    # AI4S，测试集空间分辨率为该大小，更改报错  # 全球 0.25°网格:纬向 721 点(90°S~90°N)、经向 1440 点(0~360°)
    verbose: true            # 是否打印详细日志
    cache: false             # 是否缓存数据到内存(false=每次从磁盘读)
    # 气象变量:这 69 个变量的"顺序"极其重要——它 = h5 通道顺序 = 模型输入/输出顺序 = 评分顺序
    #   前 4 个 = 地面(surface)变量;后 65 个 = 5 类高空变量 × 13 个气压层
    channels:  ['mean_sea_level_pressure', '10m_u_component_of_wind', '10m_v_component_of_wind', '2m_temperature',   # 4 个地面变量:海平面气压 / 10米U风 / 10米V风 / 2米气温

                # ── 位势高度 Z(geopotential),13 层:1000→50 hPa ──
                'geopotential_1000', 'geopotential_925', 'geopotential_850', 'geopotential_700', 'geopotential_600', 'geopotential_500',
                'geopotential_400', 'geopotential_300', 'geopotential_250', 'geopotential_200', 'geopotential_150', 'geopotential_100', 'geopotential_50',

                # ── 比湿 Q(specific_humidity),13 层 ──
                'specific_humidity_1000', 'specific_humidity_925', 'specific_humidity_850', 'specific_humidity_700', 'specific_humidity_600',
                'specific_humidity_500', 'specific_humidity_400', 'specific_humidity_300', 'specific_humidity_250', 'specific_humidity_200',
                'specific_humidity_150', 'specific_humidity_100', 'specific_humidity_50',

                # ── 温度 T(temperature),13 层 ──
                'temperature_1000', 'temperature_925', 'temperature_850', 'temperature_700', 'temperature_600', 'temperature_500', 'temperature_400',
                'temperature_300', 'temperature_250', 'temperature_200','temperature_150', 'temperature_100', 'temperature_50',

                # ── U 风分量(u_component_of_wind),13 层 ──
                'u_component_of_wind_1000', 'u_component_of_wind_925', 'u_component_of_wind_850', 'u_component_of_wind_700', 'u_component_of_wind_600',
                'u_component_of_wind_500', 'u_component_of_wind_400', 'u_component_of_wind_300', 'u_component_of_wind_250', 'u_component_of_wind_200',
                'u_component_of_wind_150', 'u_component_of_wind_100', 'u_component_of_wind_50',

                # ── V 风分量(v_component_of_wind),13 层 ──
                'v_component_of_wind_1000', 'v_component_of_wind_925', 'v_component_of_wind_850', 'v_component_of_wind_700', 'v_component_of_wind_600',
                'v_component_of_wind_500', 'v_component_of_wind_400', 'v_component_of_wind_300', 'v_component_of_wind_250', 'v_component_of_wind_200',
                'v_component_of_wind_150', 'v_component_of_wind_100', 'v_component_of_wind_50'
                ]
    # weights: 各通道在"加权 loss / 加权 RMSE"里的权重(哪些变量更重要);顺序与 channels 一一对应
    weights: [  # ---- 4 surface variables ----
                1.50,  # mean_sea_level_pressure(海平面气压,权重高)
                0.77,  # 10m_u_component_of_wind
                0.66,  # 10m_v_component_of_wind
                3.00,  # 2m_temperature(2米气温,权重最高之一)
                # ---- 13 geopotential_* (Z) ----  位势高度,整体权重高(3.0)
                3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00, 3.00,
                # ---- 13 specific_humidity_* (Q) ----  比湿,权重低(0.6)
                0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60,
                # ---- 13 temperature_* (T) ----  温度
                1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50, 1.50,
                # ---- 13 u_component_of_wind_* (U) ----  U 风
                0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77, 0.77,
                # ---- 13 v_component_of_wind_* (V) ----  V 风
                0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54, 0.54,
            ]
    # variables: 这里另给了一组 6 个"简写变量"(u10/v10/t2m/msl/z500/t850),供可视化/子集评估等用途;与上面 channels 不同用途
    variables:
      - "u10"        # 10m U wind component
      - "v10"        # 10m V wind component
      - "t2m"        # 2m temperature
      - "msl"        # Mean sea level pressure
      - "z500"       # Geopotential at 500 hPa
      - "t850"       # Temperature at 850 hPa

    # 时间配置
    time_range: ["2000-01-01", "2020-12-31"]     # 数据整体覆盖的时间范围(元信息)
    time_steps: 1                                 # AI4S，不可更改  # 输入/输出各取 1 个时间步
    time_res: 6                                   # AI4S，不可更改  # 时间分辨率 6 小时(即预测 t → t+6h)

    # 空间配置
    spatial_resolution: [0.25, 0.25]              # AI4S，不可更改  # 空间分辨率 0.25°×0.25°

    # 采样配置
    num_samples: -1  # -1 表示使用全部数据                # 采样多少条样本,-1=全用
    shuffle: true                                        # 是否打乱
    random_seed: 42                                      # 随机种子(可复现)

    # 领域特定配置(部分下游模块会用到的额外元信息)
    extra:
      levels: [500, 850, 1000]         # 关注的几个气压层(hPa)
      lat_range: [-90, 90]             # 纬度范围
      lon_range: [0, 360]              # 经度范围

  # 数据转换配置(这一段是"通用 transform 声明",真正归一化在 dataset 里用 global_means/stds 做)
  transforms:
    - type: "Normalize"                # 归一化:(x - mean) / std
      params:
        mean: [0.0, 0.0, 288.0, 101325.0, 50000.0, 270.0]   # 对应上面 6 个简写变量的经验均值
        std: [5.0, 5.0, 15.0, 1000.0, 5000.0, 10.0]         # 对应标准差
        keys: ["input", "target"]      # 对输入和标签都做归一化

    - type: "ToTensor"                 # numpy → torch.Tensor
      params:
        keys: null  # null表示转换所有numpy数组

  # 其他配置

  # DataLoader配置(torch DataLoader 的参数)
  dataloader:
    mask_dtype: "float32"              # 掩码数据类型
    batch_size: 1                     # AI4S，批处理大小推理阶段不可更改  # 推理必须 batch=1(计时/评分口径固定)
    num_workers: 0                    # 数据加载子进程数(0=主进程加载)
    pin_memory: false                 # 是否锁页内存(GPU 传输优化)
    drop_last: true                   # 丢弃最后不满一个 batch 的残余
    shuffle: false  # 使用sampler时设为false                # 推理不打乱
    persistent_workers: false         # 是否保持 worker 常驻

  # 分布式配置(单卡赛题下基本关闭)
  distributed:
    enabled: false                    # 是否启用分布式训练
    sampler: "DistributedSampler"     # 分布式采样器类型
    rank: 0                           # 当前进程编号
    world_size: 1                     # AI4S，不可更改  # 世界大小(总进程数)固定为 1=单卡
    shuffle: true
    seed: 42
    drop_last: true
